# Career data: the career page (/resume) and the career box on the home page are both built from this file.
#
# - Text shown to readers is { ko: …, en: … }. Company names can be a plain string when they are the same in both languages.
# - Dates are YYYY-MM, or YYYY-MM-DD when the exact day matters (both ends need a day for day counting).
#   Leave `end` out while it is ongoing. Durations and totals are computed at build time; the site rebuilds daily.
# - logo: a file name in src/assets/logos without .png (square, 128 × 128 or larger).
# - place.flag: kr, ae or us (src/assets/flags; see src/assets.ts to add one).
# - Newest first.

